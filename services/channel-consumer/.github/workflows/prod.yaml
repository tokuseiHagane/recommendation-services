name: Prod Branch CI/CD
on:
  push:
    branches:
      - prod-docker-legacy
      - prod

env:
  REGISTRY: ghcr.io
  GHCR_ACTOR: tokuseiHagane
  REPOSITORY: Social-Channel-Consumer
  IMAGE_NAME: channel-consumer-prod
  NAMESPACE: parsers
  BUILD_ENV: prod

jobs:
  build-and-push:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Pre-cleanup workspace
        run: |
          echo "=== Cleaning workspace before checkout ==="
          sudo rm -rf $PWD/* $PWD/.[!.]* 2>/dev/null || true
          echo "=== Workspace cleaned ==="

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.GHCR_ACTOR }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_ENV=${{ env.BUILD_ENV }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, Linux]
    steps:
      - name: Deploy channel-consumer-prod to Kubernetes
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$SSH_KEY"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
            'kubectl rollout restart deployment/vk-channel-consumer-prod -n ${{ env.NAMESPACE }} && \
             kubectl rollout status deployment/vk-channel-consumer-prod -n ${{ env.NAMESPACE }} --timeout=300s'
          echo "channel-consumer-prod deployed successfully"

      - name: Deployment complete
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Deployment updated!"
          echo "  channel-consumer-prod"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
