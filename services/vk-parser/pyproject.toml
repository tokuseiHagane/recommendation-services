[project]
name = "vk-parser-service"
version = "0.1.0"
description = "VK Parser Service built with Porto architecture, Litestar, PostgreSQL, Redis, and Logfire"
authors = [
    {name = "Author", email = "author@example.com"}
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "litestar>=2.12.0",
    "pydantic>=2.9.0",
    "pydantic-settings",
    "piccolo>=1.22.0",
    "piccolo[postgres]",
    # 0.31.0 — первый релиз с prebuilt wheels под CPython 3.14 (cp314).
    # Без него Docker-сборка потянет компиляцию из исходников.
    "asyncpg>=0.31.0",
    "dishka>=1.4.0",
    "logfire[httpx]>=2.7.0",
    "logfire[asgi]",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.0",
    "watchfiles>=0.25.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "redis[hiredis]>=5.0.0",
    # VK API
    "aiovk>=4.0.0",
    "anyio>=4.0.0",
    "rich>=13.0.0",
    "typing_extensions>=4.0.0",
    # Auth
    # extras `[crypto]` тянет `cryptography`, без которого PyJWT валится с
    # MissingCryptographyError на любых асимметричных алгоритмах (RS256/EdDSA/ES256).
    # Better Auth выдаёт JWKS с RS256 (см. AUTH_JWT_ALGORITHMS), так что extras обязательны.
    "PyJWT[crypto]>=2.8.0",
    # Broker
    "aiokafka>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by ruff formatter
    "B008", # do not perform function calls in argument defaults
    "W191", # indentation contains tabs
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
no_implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
native-tls = true
