[project]
name = "recommendation-services"
version = "0.1.0"
description = "Monorepo for FatData recommendation system microservices"
requires-python = ">=3.11"
dependencies = [
    "litestar>=2.15",
    "piccolo[all]>=1.25",
    "opensearch-py[async]>=2.8",
    "apscheduler>=3.10",
    "dishka>=1.5",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "logfire[litestar]>=3.12",
    "opentelemetry-distro>=0.50b0",
    "opentelemetry-exporter-otlp>=1.29",
    "opentelemetry-instrumentation-asgi>=0.50b0",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[tool.uv.workspace]
members = ["normalizer", "indexer", "recs_api"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
