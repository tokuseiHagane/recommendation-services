apiVersion: v1
kind: ConfigMap
metadata:
  name: opensearch-index-mapping
  namespace: recsys
  labels:
    app: opensearch
data:
  resource-documents-mapping.json: |
    {
      "settings": {
        "number_of_shards": 1,
        "number_of_replicas": 0
      },
      "mappings": {
        "properties": {
          "title": {
            "type": "text",
            "fields": {
              "keyword": {
                "type": "keyword",
                "ignore_above": 512
              }
            }
          },
          "description": {
            "type": "text"
          },
          "topic_keywords": {
            "type": "text"
          },
          "platform": {
            "type": "keyword"
          },
          "audience_size": {
            "type": "integer"
          },
          "avg_views": {
            "type": "float"
          },
          "engagement_rate": {
            "type": "float"
          },
          "category": {
            "type": "keyword"
          },
          "last_updated": {
            "type": "date"
          },
          "source_community_id": {
            "type": "keyword"
          }
        }
      }
    }
