apiVersion: v1
kind: Secret
metadata:
  name: vkparser-prod-secret
  namespace: parsers
  labels:
    app: vkparser-prod
    version: prod
type: Opaque
stringData:
  # Подключение к prod Postgres. Заполнить реальными кредами перед apply.
  DATABASE_URL: "postgresql://CHANGE_ME:CHANGE_ME@postgres-prod.databases.svc.cluster.local:5432/vkparser_db"

  # Тот же shared secret, что и у auth-prod (см. auth-prod-secret.AUTH_BACKEND_SHARED_SECRET)
  AUTH_BACKEND_SHARED_SECRET: "CHANGE_ME"
  JWT_SECRET_KEY: "CHANGE_ME"
  JWT_ALGORITHM: "HS256"

  VK_ACCESS_TOKEN: ""

  LOGFIRE_TOKEN: ""
