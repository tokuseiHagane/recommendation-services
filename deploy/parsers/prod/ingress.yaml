apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vkparser-prod-ingress
  namespace: parsers
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://*.fatdataseo.com,https://fatdataseo.com"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Cookie"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - analytics.fatdataseo.com
      secretName: cert-secret
  rules:
    - host: analytics.fatdataseo.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: vkparser-prod-service
                port:
                  number: 8000
