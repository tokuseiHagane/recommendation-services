apiVersion: apps/v1
kind: Deployment
metadata:
  name: tg-posts-consumer-prod
  namespace: parsers
  labels:
    app: tg-posts-consumer-prod
    component: posts-consumer
    provider: telegram
    version: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tg-posts-consumer-prod
  template:
    metadata:
      labels:
        app: tg-posts-consumer-prod
        component: posts-consumer
        provider: telegram
        version: prod
    spec:
      containers:
        - name: tg-posts-consumer-prod
          image: ghcr.io/fatdataproduct/telegram-posts-consumers/posts-consumer-prod:latest
          imagePullPolicy: Always
          command: ["/docker-entrypoint.sh"]
          args: ["python", "-m", "src.BootstrapTg"]
          env:
            - name: SERVICE
              value: "tg"
          envFrom:
            - configMapRef:
                name: tg-posts-consumer-prod-configmap
            - secretRef:
                name: tg-posts-consumer-prod-secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "4Gi"
              cpu: "2"
      nodeSelector:
        kubernetes.io/hostname: angron-node0
      imagePullSecrets:
        - name: ghcr-login-secret
