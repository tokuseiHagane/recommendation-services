apiVersion: v1
kind: ConfigMap
metadata:
  name: tg-posts-consumer-test-configmap
  namespace: parsers
  labels:
    app: tg-posts-consumer-test
    provider: telegram
    version: test
data:
  APP_NAME: "tg-posts-consumer"
  ENV: "test"
  DEBUG: "false"
  LOG_LEVEL: "INFO"

  # Telegram posts database — общая с tg-channel-consumer (telegram_db).
  # Отдельно от VKParserService: таблица `posts` у TG (поля content, link JSONB,
  # id_channels, reactions) структурно несовместима с VK posts, поэтому
  # телеграм-пайплайн живёт в своей БД.
  DB_HOST: "postgres.databases.svc.cluster.local"
  DB_PORT: "5432"
  DB_USER: "root"
  DB_NAME: "telegram_db"

  # Kafka / Redpanda
  KAFKA_BOOTSTRAP_SERVERS: "redpanda.redpanda.svc.cluster.local:9092"

  KAFKA_CHANNELS_DIFF_TOPIC: "tg_channels_diff"
  KAFKA_POSTS_TOPIC_PREFIX: "tg_posts_"
  KAFKA_GROUP_ID_PREFIX: "tg-posts-consumer-test"

  # Processing
  BATCH_SIZE: "100"
  BATCH_TIMEOUT_MS: "10000"
  CACHE_TTL_SECONDS: "300"
  CONSUMER_TIMEOUT_MS: "1000"
  AUTO_OFFSET_RESET: "earliest"
