apiVersion: apps/v1
kind: Deployment
metadata:
  name: vk-channel-consumer-test
  namespace: parsers
  labels:
    app: vk-channel-consumer-test
    provider: vk
    version: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vk-channel-consumer-test
  template:
    metadata:
      labels:
        app: vk-channel-consumer-test
        provider: vk
        version: test
    spec:
      containers:
        - name: vk-channel-consumer-test
          image: ghcr.io/fatdataproduct/social-channel-consumer/channel-consumer-test:latest
          imagePullPolicy: Always
          command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: vk-channel-consumer-test-configmap
            - secretRef:
                name: vk-channel-consumer-test-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      nodeSelector:
        kubernetes.io/hostname: angron-node0
      imagePullSecrets:
        - name: ghcr-login-secret
