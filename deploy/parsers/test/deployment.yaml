apiVersion: apps/v1
kind: Deployment
metadata:
  name: vkparser-test
  namespace: parsers
  labels:
    app: vkparser-test
    version: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vkparser-test
  template:
    metadata:
      labels:
        app: vkparser-test
        version: test
    spec:
      initContainers:
        - name: migrations
          image: ghcr.io/fatdataproduct/vkparserservice/vkparser-test:latest
          imagePullPolicy: Always
          command: ["python", "scripts/migrate.py"]
          envFrom:
            - configMapRef:
                name: vkparser-test-configmap
            - secretRef:
                name: vkparser-test-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      containers:
        - name: vkparser-test
          image: ghcr.io/fatdataproduct/vkparserservice/vkparser-test:latest
          imagePullPolicy: Always
          command: ["python", "-m", "src.Bootstrap"]
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: vkparser-test-configmap
            - secretRef:
                name: vkparser-test-secret
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      nodeSelector:
        kubernetes.io/hostname: angron-node0
      imagePullSecrets:
        - name: ghcr-login-secret
