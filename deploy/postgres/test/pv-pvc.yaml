apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv
  namespace: databases
spec:
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /mnt/storage/
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: node-role.kubernetes.io/worker
          operator: In
          values:
          - worker
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: postgres-pvc
  namespace: databases
spec:
  storageClassName: "local-storage"
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 20Gi