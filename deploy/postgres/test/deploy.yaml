apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: databases
spec:
  selector:
   matchLabels:
    app: postgres
  replicas: 1
  template:
    metadata:
      labels:
        app: postgres
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: worker
      containers:
        - name: postgres
          image: postgres:18
          imagePullPolicy: "IfNotPresent"
          env:
           - name: POSTGRES_USER
             valueFrom:
               secretKeyRef:
                 name: postgres-secret
                 key: postgres-root-username
           - name: POSTGRES_PASSWORD
             valueFrom:
               secretKeyRef:
                 name: postgres-secret
                 key: postgres-root-password
           - name: POSTGRES_DB
             valueFrom:
               configMapKeyRef:
                 name: postgres-configmap
                 key: postgres-dbname
          ports:
            - containerPort: 5432
          volumeMounts:
            - mountPath: /var/lib/postgresql/18/docker
              subPath: pgdata
              name: postgres-pv
            - mountPath: /etc/postgresql/conf.d
              name: postgres-config-volume
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "12Gi"
              cpu: "4"
      volumes:
      - name: postgres-pv
        persistentVolumeClaim:
          claimName: postgres-pvc
      - name: postgres-config-volume
        configMap:
          name: postgres-config
          items:
          - key: postgresql.conf
            path: postgresql.conf
          defaultMode: 0644
